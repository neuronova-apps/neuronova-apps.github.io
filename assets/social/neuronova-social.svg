      <text x="66" y="58" fill="#65ddff" font-size="30" font-weight="900" text-anchor="middle">BR</text>
      <text x="66" y="91" fill="#dbe7f2" font-size="14" font-weight="700" text-anchor="middle">Brailux</text>
    </g>
    <g transform="translate(444 0)">
