  <rect x="74" y="550" width="1020" height="1" fill="#65ddff" opacity=".18"/>
  <text x="74" y="588" fill="#8fa2b7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650">Aprendizaje · Accesibilidad · Bienestar · Espiritualidad · Entretenimiento</text>
  <circle cx="1080" cy="76" r="5" fill="#65ddff"/>
  <circle cx="1110" cy="102" r="3" fill="#b28dff"/>
  <circle cx="1045" cy="122" r="2.5" fill="#7f9cff"/>
