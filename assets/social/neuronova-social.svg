      <text x="66" y="58" fill="#7f9cff" font-size="30" font-weight="900" text-anchor="middle">EF</text>
      <text x="66" y="91" fill="#dbe7f2" font-size="14" font-weight="700" text-anchor="middle">English Fast</text>
    </g>
    <g transform="translate(592 0)">
      <rect width="132" height="116" rx="20" fill="#0d1b2c" stroke="#6ce7b0" stroke-opacity=".65"/>
      <text x="66" y="58" fill="#6ce7b0" font-size="30" font-weight="900" text-anchor="middle">SU</text>
      <text x="66" y="91" fill="#dbe7f2" font-size="14" font-weight="700" text-anchor="middle">Sudolux</text>
    </g>
    <g transform="translate(740 0)">
      <rect width="132" height="116" rx="20" fill="#0d1b2c" stroke="#ff9f7a" stroke-opacity=".65"/>
      <text x="66" y="58" fill="#ff9f7a" font-size="30" font-weight="900" text-anchor="middle">CR</text>
      <text x="66" y="91" fill="#dbe7f2" font-size="14" font-weight="700" text-anchor="middle">Crucilux</text>
    </g>
    <g transform="translate(888 0)">
      <rect width="132" height="116" rx="20" fill="#0d1b2c" stroke="#f2a6d7" stroke-opacity=".65"/>
      <text x="66" y="58" fill="#f2a6d7" font-size="30" font-weight="900" text-anchor="middle">MO</text>
      <text x="66" y="91" fill="#dbe7f2" font-size="14" font-weight="700" text-anchor="middle">Motiva</text>
