<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Crucilux</title>
  <desc id="desc">Símbolo de Crucilux: una C cyan sobre una placa azul oscuro con borde cyan.</desc>
  <defs>
    <linearGradient id="bg" x1="18" y1="10" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071a32"/>
      <stop offset="1" stop-color="#041326"/>
    </linearGradient>
    <linearGradient id="cyan" x1="24" y1="18" x2="106" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#42d8ff"/>
      <stop offset="1" stop-color="#27c5ee"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="124" height="124" rx="16" fill="url(#bg)"/>
  <rect x="3.5" y="3.5" width="121" height="121" rx="15" fill="none" stroke="url(#cyan)" stroke-width="3"/>

  <path
    d="M88 43H56C46 43 40 49 40 59V75C40 85 46 91 56 91H88"
    fill="none"
    stroke="url(#cyan)"
    stroke-width="14"
    stroke-linecap="butt"
    stroke-linejoin="round"
    filter="url(#softGlow)"
  />
</svg>
