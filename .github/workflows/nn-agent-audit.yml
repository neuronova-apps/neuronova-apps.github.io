name: NN Agent - Auditoría estática
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/nn_agent/**'
      - 'docs/agente/**'
      - '.github/workflows/nn-agent-audit.yml'
  schedule:
    - cron: '17 11 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar inventario y diagnóstico sin modificar archivos
        run: python3 tools/nn_agent/audit.py > nn-agent-report.json
      - name: Publicar reporte como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nn-agent-audit
          path: nn-agent-report.json
          if-no-files-found: warn
