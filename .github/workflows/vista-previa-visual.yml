name: Vista previa visual NN
on:
  pull_request:
    paths:
      - 'index.html'
      - 'inclusion-accesibilidad/**'
      - 'bienestar-personal/**'
      - 'desarrollo-espiritual/**'
      - 'educacion-aprendizaje/**'
      - 'assets/categories/**'
      - '.github/workflows/vista-previa-visual.yml'
      - 'scripts/capturas-matriz-web.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Generar capturas para revisión
        run: node scripts/capturas-matriz-web.js
      - name: Publicar capturas en GitHub Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neuro-nova-vista-previa-web
          path: preview-web/
          if-no-files-found: warn
          retention-days: 14
